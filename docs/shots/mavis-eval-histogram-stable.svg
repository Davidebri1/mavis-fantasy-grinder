idth="1"/><line x1="74" y1="524" x2="830" y2="524" stroke="#22272e" stroke-width="1"/><line x1="74" y1="524" x2="74" y2="528" stroke="#22272e" stroke-width="1"/><text x="74" y="542" font-size="11" fill="#5a6472" text-anchor="middle">0</text><line x1="254" y1="524" x2="254" y2="528" stroke="#22272e" stroke-width="1"/><text x="254" y="542" font-size="11" fill="#5a6472" text-anchor="middle">10</text><line x1="434" y1="524" x2="434" y2="528" stroke="#22272e" stroke-width="1"/><text x="434" y="542" font-size="11" fill="#5a6472" text-anchor="middle">20</text><line x1="614" y1="524" x2="614" y2="528" stroke="#22272e" stroke-width="1"/><text x="614" y="542" font-size="11" fill="#5a6472" text-anchor="middle">30</text><line x1="794" y1="524" x2="794" y2="528" stroke="#22272e" stroke-width="1"/><text x="794" y="542" font-size="11" fill="#5a6472" text-anchor="middle">40</text><text x="66" y="528" font-size="11" fill="#5a6472" text-anchor="end">0</text><text x="66" y="381.33333333333337" font-size="11" fill="#5a6472" text-anchor="end">2</text><text x="66" y="234.66666666666669" font-size="11" fill="#5a6472" text-anchor="end">4</text><text x="66" y="88" font-size="11" fill="#5a6472" text-anchor="end">6</text><text x="452" y="564" font-size="12" fill="#5a6472" text-anchor="middle">DraftKings fantasy points (bin width 2)</text><text x="28" y="304" font-size="12" fill="#5a6472" text-anchor="middle" transform="rotate(-90 28 304)">games</text><line x1="398" y1="78" x2="398" y2="524" stroke="#c23b2e" stroke-width="2"/><text x="404" y="74" font-size="13" fill="#c23b2e" text-anchor="start" font-weight="600">cut C = 18.0</text><rect x="74" y="54" width="12" height="12" fill="#c3cad3"/><text x="91" y="64" font-size="12" fill="#22272e">low half (&lt;= C), n=21</text><rect x="252" y="54" width="12" height="12" fill="#697382"/><text x="269" y="64" font-size="12" fill="#22272e">high half (&gt; C), n=21</text><text x="74" y="24" font-size="15" fill="#22272e" text-anchor="start" font-weight="700">Matthew Stafford (QB, DET/LAR) - DK points in the games of record, 42 games, 2009-11-26 to 2026-09-11</text><text x="74" y="44" font-size="11.5" fill="#5a6472">Games of record = this player's games inside the sampled teams' schedules; a log can be part of a career.</text><text x="74" y="586" font-size="10.5" fill="#5a6472">Cut C = the largest value in the low half of the median split.</text><text x="74" y="602" font-size="10.5" fill="#5a6472">Selection: lowest coefficient of variation of games-of-record DK points among players with &gt;= 30 evaluations</text></g></svg>