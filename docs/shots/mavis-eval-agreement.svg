or="middle" font-weight="700">51.1%</text><text x="737.3333333333333" y="554" font-size="13" fill="#22272e" text-anchor="middle" font-weight="700">all evaluations</text><text x="74" y="24" font-size="15" fill="#22272e" text-anchor="start" font-weight="700">Categorization agreement: does the categorization match the actual category?</text><text x="74" y="46" font-size="11.5" fill="#5a6472">Agree (same) = high on a boom, low on a bust, cut C per game. Each bar carries its own no-skill reference (red tick) and the z-test against it.</text><text x="74" y="64" font-size="11.5" fill="#5a6472">The no-skill reference is what a predictor with no information about the outcome would score on that population - it is not 50% here.</text><text x="74" y="82" font-size="11.5" fill="#5a6472">Booms and busts are separate populations here, never complements - each bar carries its own n.</text></g></svg>