ont-size="11" fill="#22272e" text-anchor="middle" font-weight="600">lift +3.0 pts</text><text x="768.8" y="558" font-size="10.5" fill="#5a6472" text-anchor="middle">perm p 0.000</text><text x="716" y="586" font-size="13.5" fill="#22272e" text-anchor="middle" font-weight="700">bust games</text><text x="716" y="604" font-size="11" fill="#5a6472" text-anchor="middle">actual below the lower control limit</text><text x="74" y="24" font-size="15.5" fill="#22272e" text-anchor="start" font-weight="700">Direction: does the call point at the right control limit?</text><text x="74" y="46" font-size="11.5" fill="#5a6472">On a boom the call points up; on a bust it points down. A projection exactly at the band midpoint makes no call.</text><text x="74" y="64" font-size="11.5" fill="#5a6472">The red tick is each side's OWN no-skill reference: the rate it scores when it carries no information about the outcome (its own pointing rate over the same rows).</text><text x="74" y="82" font-size="11.5" fill="#5a6472">There is no 50% line here, and booms and busts are separate populations - each bar carries its own n.</text><text x="74" y="100" font-size="11.5" fill="#5a6472">Model pointing up on 7,997 of 17,593 evaluations; baseline on 4,971.</text><text x="74" y="118" font-size="11.5" fill="#5a6472">Permutation p is one-sided (shuffled calls against the real outcomes, 10,000 shuffles, seed 20261117).</text></g></svg>