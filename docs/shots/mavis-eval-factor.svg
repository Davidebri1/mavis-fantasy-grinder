<svg xmlns="http://www.w3.org/2000/svg" width="860" height="540" viewBox="0 0 860 540"><rect width="100%" height="100%" fill="white"/><g font-family="Segoe UI, Arial, sans-serif"><line x1="74" y1="384" x2="830" y2="384" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="388" font-size="11" fill="#5a6472" text-anchor="end">0%</text><line x1="74" y1="358.2" x2="830" y2="358.2" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="362.2" font-size="11" fill="#5a6472" text-anchor="end">10%</text><line x1="74" y1="332.4" x2="830" y2="332.4" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="336.4" font-size="11" fill="#5a6472" text-anchor="end">20%</text><line x1="74" y1="306.6" x2="830" y2="306.6" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="310.6" font-size="11" fill="#5a6472" text-anchor="end">30%</text><line x1="74" y1="280.8" x2="830" y2="280.8" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="284.8" font-size="11" fill="#5a6472" text-anchor="end">40%</text><line x1="74" y1="255" x2="830" y2="255" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="259" font-size="11" fill="#5a6472" text-anchor="end">50%</text><line x1="74" y1="229.20000000000002" x2="830" y2="229.20000000000002" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="233.20000000000002" font-size="11" fill="#5a6472" text-anchor="end">60%</text><line x1="74" y1="203.4" x2="830" y2="203.4" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="207.4" font-size="11" fill="#5a6472" text-anchor="end">70%</text><line x1="74" y1="177.6" x2="830" y2="177.6" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="181.6" font-size="11" fill="#5a6472" text-anchor="end">80%</text><line x1="74" y1="151.79999999999998" x2="830" y2="151.79999999999998" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="155.79999999999998" font-size="11" fill="#5a6472" text-anchor="end">90%</text><line x1="74" y1="126" x2="830" y2="126" stroke="#e4e8ee" stroke-width="1"/><text x="66" y="130" font-size="11" fill="#5a6472" text-anchor="end">100%</text><line x1="74" y1="384" x2="830" y2="384" stroke="#22272e" stroke-width="1"/><line x1="74" y1="126" x2="74" y2="384" stroke="#22272e" stroke-width="1"/><rect x="206.3" y="322.36379999999997" width="113.39999999999999" height="61.63620000000003" fill="#39424e"/><text x="263" y="312.36379999999997" font-size="13.5" fill="#22272e" text-anchor="middle" font-weight="700">23.9%</text><text x="263" y="294.36379999999997" font-size="11" fill="#5a6472" text-anchor="middle">1,909 booms</text><line x1="200.3" y1="324.7116" x2="325.7" y2="324.7116" stroke="#c23b2e" stroke-width="1.9"/><text x="263" y="414" font-size="12.5" fill="#22272e" text-anchor="middle" font-weight="600">condition holds (P = 1)</text><text x="263" y="432" font-size="11" fill="#5a6472" text-anchor="middle">n=7,990</text><rect x="584.3" y="328.8654" width="113.39999999999999" height="55.13459999999998" fill="#9aa5b1"/><text x="641" y="318.8654" font-size="13.5" fill="#22272e" text-anchor="middle" font-weight="700">21.4%</text><text x="641" y="300.8654" font-size="11" fill="#5a6472" text-anchor="middle">967 booms</text><line x1="578.3" y1="324.7116" x2="703.6999999999999" y2="324.7116" stroke="#c23b2e" stroke-width="1.9"/><text x="641" y="414" font-size="12.5" fill="#22272e" text-anchor="middle" font-weight="600">condition does not hold (P = 0)</text><text x="641" y="432" font-size="11" fill="#5a6472" text-anchor="middle">n=4,525</text><text x="452" y="464" font-size="11.5" fill="#c23b2e" text-anchor="middle" font-weight="600">red tick = the factor path's own boom rate (23.0%): if the factor carried nothing, both bars would sit on it</text><text x="74" y="24" font-size="15.5" fill="#22272e" text-anchor="start" font-weight="700">Is the winning factor informative out of sample?</text><text x="74" y="46" font-size="11.5" fill="#5a6472">On the factor path: boom rate on the games where the winning condition holds, against the games where it does not.</text><text x="74" y="64" font-size="11.5" fill="#5a6472">The factor is chosen from the earlier games only, so these are out-of-sample rows.</text><text x="74" y="82" font-size="11.5" fill="#5a6472">Difference +2.5 points: z = 3.22, p = 0.001 (two-proportion test).</text><text x="74" y="100" font-size="11.5" fill="#5a6472">Small, and real: the condition does carry information - it is not noise. The factor path covers 12,515 evaluations.</text></g></svg>