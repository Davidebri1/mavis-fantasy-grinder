ext-anchor="middle" font-weight="700">+2.70</text><text x="395" y="217.76" font-size="11" fill="#5a6472" text-anchor="middle">z=4.24</text><text x="395" y="416" font-size="12" fill="#22272e" text-anchor="middle" font-weight="600">model - bust</text><text x="395" y="434" font-size="11" fill="#5a6472" text-anchor="middle">n=4,978</text><text x="395" y="452" font-size="11" fill="#5a6472" text-anchor="middle">observed 31.4%</text><text x="395" y="469" font-size="10.5" fill="#c23b2e" text-anchor="middle">reference 28.7%</text><rect x="559.78" y="179.2" width="98.44" height="204.8" fill="#9aa5b1"/><text x="609" y="169.2" font-size="13" fill="#22272e" text-anchor="middle" font-weight="700">+4.00</text><text x="609" y="151.2" font-size="11" fill="#5a6472" text-anchor="middle">z=5.74</text><text x="609" y="416" font-size="12" fill="#22272e" text-anchor="middle" font-weight="600">baseline - boom</text><text x="609" y="434" font-size="11" fill="#5a6472" text-anchor="middle">n=4,133</text><text x="609" y="452" font-size="11" fill="#5a6472" text-anchor="middle">observed 32.3%</text><text x="609" y="469" font-size="10.5" fill="#c23b2e" text-anchor="middle">reference 28.3%</text><rect x="773.78" y="230.4" width="98.44" height="153.6" fill="#9aa5b1"/><text x="823" y="220.4" font-size="13" fill="#22272e" text-anchor="middle" font-weight="700">+3.00</text><text x="823" y="202.4" font-size="11" fill="#5a6472" text-anchor="middle">z=4.37</text><text x="823" y="416" font-size="12" fill="#22272e" text-anchor="middle" font-weight="600">baseline - bust</text><text x="823" y="434" font-size="11" fill="#5a6472" text-anchor="middle">n=4,978</text><text x="823" y="452" font-size="11" fill="#5a6472" text-anchor="middle">observed 38.9%</text><text x="823" y="469" font-size="10.5" fill="#c23b2e" text-anchor="middle">reference 36.0%</text><text x="74" y="24" font-size="15.5" fill="#22272e" text-anchor="start" font-weight="700">Lift above each side's own no-skill reference (percentage points)</text><text x="74" y="46" font-size="11.5" fill="#5a6472">The lean is removed: each side is scored against the rate it reaches carrying no information about the outcome.</text><text x="74" y="64" font-size="11.5" fill="#5a6472">A bar at zero means the side does no better on those games than its own pointing rate already gives it.</text><text x="74" y="82" font-size="11.5" fill="#5a6472">Model booms sit at +0.8 points (z=1.04): the factor path buys almost nothing on booms.</text><text x="74" y="100" font-size="11.5" fill="#5a6472">The baseline booms sit at +4.0 points (z=5.74): the plain prior-games average does.</text><text x="74" y="118" font-size="11.5" fill="#5a6472">Data: 17,593 evaluations with control limits - 4,133 booms, 4,978 busts, 8,482 inside the band.</text></g></svg>